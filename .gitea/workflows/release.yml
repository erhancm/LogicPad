# LogicPad release — Linux via Unraid act_runner; Windows via Publish-Gitea-Release.ps1 until a Windows runner exists.
# Push a v* tag to build Linux AppImage + deb and attach to a Gitea Release.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: 04 Software/logicpad-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libudev-dev \
            pkg-config

      - name: Build LogicPad (Linux)
        working-directory: 04 Software/logicpad-app
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/04 Software/logicpad-app/src-tauri/target
        run: |
          npm ci
          npm run tauri build -- --bundles appimage,deb

      - name: Stage release files
        run: |
          set -euo pipefail
          root="04 Software/logicpad-app/src-tauri/target/release"
          mkdir -p staging

          shopt -s nullglob
          for f in "$root"/bundle/appimage/*.AppImage; do cp "$f" staging/; done
          for f in "$root"/bundle/deb/*.deb; do cp "$f" staging/; done

          ls -la staging/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: logicpad-linux
          path: staging/
          if-no-files-found: error

  release:
    needs: build-linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Add shared assets
        run: |
          cp "04 Software/logicpad-app/productivity/LogicPad-Productivity.yaml" release-assets/
          ls -la release-assets/

      - name: Publish Gitea release
        uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: LogicPad ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            release-assets/*
