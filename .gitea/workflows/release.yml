# Cross-platform LogicPad companion app release.
# Push a v* tag to build Windows, macOS, and Linux installers and attach them to one Gitea Release.
# Requires Actions runners: windows-latest, macos-latest, ubuntu-22.04 (or equivalent labels).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: windows
          - os: macos-latest
            bundles: dmg
            artifact: macos
          - os: ubuntu-22.04
            bundles: appimage,deb
            artifact: linux

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: 04 Software/logicpad-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Build LogicPad (${{ matrix.os }})
        working-directory: 04 Software/logicpad-app
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/04 Software/logicpad-app/src-tauri/target
        run: |
          npm ci
          npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Stage release files
        run: |
          set -euo pipefail
          root="04 Software/logicpad-app/src-tauri/target/release"
          mkdir -p staging

          shopt -s nullglob
          for f in "$root"/bundle/nsis/LogicPad_*_x64-setup.exe; do cp "$f" staging/; done
          for f in "$root"/bundle/dmg/*.dmg; do cp "$f" staging/; done
          for f in "$root"/bundle/appimage/*.AppImage; do cp "$f" staging/; done
          for f in "$root"/bundle/deb/*.deb; do cp "$f" staging/; done

          if [ -f "$root/LogicPad.exe" ]; then
            cp "$root/LogicPad.exe" staging/LogicPad-windows-x64.exe
          elif [ -f "$root/logicpad-app" ]; then
            cp "$root/logicpad-app" staging/logicpad-app-linux
          elif [ -f "$root/LogicPad" ]; then
            cp "$root/LogicPad" staging/LogicPad-macos
          fi

          ls -la staging/

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: logicpad-${{ matrix.artifact }}
          path: staging/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Add shared assets
        run: |
          cp "04 Software/logicpad-app/productivity/LogicPad-Productivity.yaml" release-assets/
          ls -la release-assets/

      - name: Publish Gitea release
        uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: LogicPad ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            release-assets/*
