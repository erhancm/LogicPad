<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="screenshot.css">
<title>LogicPad Profiles</title>
<style>body{margin:0;background:#0e1014}.shot{margin:0;width:960px;height:600px}</style>
</head>
<body>
<div class="shot">
  <aside class="nav">
    <div class="brand">
      <div class="mark"><i style="left:5px;top:5px"></i><i style="left:13px;top:5px"></i><i style="left:21px;top:5px"></i><i style="left:5px;top:13px"></i><i style="left:21px;top:13px"></i><i style="left:5px;top:21px"></i><i style="left:13px;top:21px;background:#e8e4d8"></i><i style="left:21px;top:21px"></i></div>
      <div><h1>LogicPad</h1><p>Configurator</p></div>
    </div>
    <div class="tab">Keys</div>
    <div class="tab on">Profiles</div>
    <div class="tab">Auto-switch</div>
  </aside>
  <main class="main">
    <div class="toolbar"><div><h2 style="display:inline">Profiles</h2><span class="chip">LogicPad</span></div><button class="btn primary">Save</button></div>
    <div class="profiles-layout">
      <div>
        <div class="card on"><div><strong>Media</strong><em>Wave · blue</em></div><div class="mini-leds"><i style="background:#3388ff"></i><i></i><i style="background:#3388ff"></i><i style="background:#ff3344"></i><i style="background:#33cc66"></i><i style="background:#3388ff"></i><i style="background:#ff3344"></i><i style="background:#33cc66"></i><i style="background:#3388ff"></i><i></i><i></i><i></i></div></div>
        <div class="card"><div><strong>Create</strong><em>Solid · blue</em></div><div class="mini-leds"><i style="background:#3388ff"></i><i style="background:#3388ff"></i><i style="background:#3388ff"></i><i style="background:#3388ff"></i><i style="background:#3388ff"></i><i style="background:#3388ff"></i><i style="background:#3388ff"></i><i style="background:#3388ff"></i><i style="background:#3388ff"></i><i></i><i></i><i></i></div></div>
        <div class="card"><div><strong>Stream</strong><em>Ripple · red</em></div><div class="mini-leds"><i style="background:#ff3344"></i><i style="background:#ff3344"></i><i style="background:#ff3344"></i><i style="background:#ff3344"></i><i style="background:#ff3344"></i><i style="background:#ff3344"></i><i style="background:#ff3344"></i><i style="background:#ff3344"></i><i style="background:#ff3344"></i><i></i><i></i><i></i></div></div>
        <div class="card"><div><strong>Meet</strong><em>Breathe · green</em></div><div class="mini-leds"><i style="background:#33cc66"></i><i style="background:#33cc66"></i><i style="background:#33cc66"></i><i style="background:#33cc66"></i><i style="background:#33cc66"></i><i style="background:#33cc66"></i><i style="background:#33cc66"></i><i style="background:#33cc66"></i><i style="background:#33cc66"></i><i></i><i></i><i></i></div></div>
        <div class="prof-row" style="margin-top:8px"><button class="btn">Duplicate</button><button class="btn">Reset</button><button class="btn">Delete</button></div>
      </div>
      <div>
        <h3 class="section">LIGHTING</h3>
        <div class="mode-tiles"><button class="on">Wave</button><button>Ripple</button><button>Breathe</button><button>Rain</button><button>Solid</button></div>
        <div class="pad-leds">
          <div class="led sel">SEL</div><div class="led"></div><div class="led"></div>
          <div class="led" style="background:#ff3344"></div><div class="led" style="background:#33cc66"></div><div class="led" style="background:#3388ff"></div>
          <div class="led" style="background:#ff3344"></div><div class="led" style="background:#33cc66"></div><div class="led" style="background:#3388ff"></div>
          <div class="led"></div><div class="led"></div><div class="led"></div>
        </div>
        <h3 class="section" style="margin-top:16px">OLED SCREEN</h3>
        <div class="prof-row"><button class="btn">Contrast</button><button class="btn">Flip</button><button class="btn on">Sleep 30s</button></div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
